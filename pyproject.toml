[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm-prefillonly"
version = "0.3.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "A prefill-only optimization of nano-vllm for embedding, reranking and single-token generation"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
    "safetensors",
    "numpy",
    "pillow",
    "huggingface_hub",
]

[project.urls]
Homepage = "https://github.com/86MaxCao/nano-vllm-prefillonly"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: GPU + model-weight accuracy tests (deselect with -m 'not slow')",
]
