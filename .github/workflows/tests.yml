name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # GPU-free unit tests: weight loading, pooling, sampling, rope, config.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps CI light; flash-attn/triton are not needed for
          # the unit suite, which never touches CUDA.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers safetensors numpy xxhash pytest
      - name: Run unit tests
        run: pytest tests/test_unit.py -v
