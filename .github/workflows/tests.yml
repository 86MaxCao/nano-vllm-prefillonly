name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # GPU-free unit tests: weight loading, pooling, sampling, rope, config.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps CI light; flash-attn needs a CUDA toolchain to
          # build, so it is skipped — the unit suite never launches attention.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install the package without deps so `import nanovllm` resolves.
          # triton is a module-level import in layers/attention.py.
          pip install -e . --no-deps
          pip install triton transformers safetensors numpy xxhash pillow huggingface_hub pytest
      - name: Run unit tests
        run: pytest tests/test_unit.py -v
